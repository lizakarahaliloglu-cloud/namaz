<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Мой день</title>

<style>
:root{
  --bg:#f6f1eb;
  --card:#ffffff;
  --text:#4b3f35;
  --soft:#8b7c6f;
  --accent:#d6b46a;
}

body.dark{
  --bg:#121212;
  --card:#1f1f1f;
  --text:#e6e6e6;
  --soft:#aaa;
  --accent:#c9a24d;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  max-width:420px;
  margin:0 auto;
  padding:20px;
  background:var(--bg);
  color:var(--text);
}

h1{text-align:center;margin-bottom:12px}

.section{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
}

.center{text-align:center}

/* CALENDAR */
.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.cal-day{
  aspect-ratio:1;
  border-radius:12px;
  background:#eee6dc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  cursor:pointer;
}

.cal-day.done{background:var(--accent);color:#fff}
.cal-day.partial{background:#e6d6b8}
.cal-day.today{outline:2px solid var(--accent)}

body.dark .cal-day{background:#2a2a2a}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  display:none;
  z-index:10;
}

#modalBg{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.4);
}

#modalBox{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:24px 24px 0 0;
  padding:20px;
}

.modal-prayer{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid rgba(0,0,0,.05);
  cursor:pointer;
}

.modal-prayer.done{color:var(--soft)}

.footer{
  text-align:center;
  font-size:12px;
  color:var(--soft);
  margin-top:14px;
}
</style>
</head>

<body>

<h1>🌿 Мой день</h1>

<div class="section">
  <div class="cal-head">
    <button onclick="changeMonth(-1)">‹</button>
    <div id="monthTitle"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="calendar" id="calendar"></div>
</div>

<div class="footer">created by Elizaveta Karahaliloğlu</div>

<!-- MODAL -->
<div id="modal">
  <div id="modalBg" onclick="closeModal()"></div>
  <div id="modalBox">
    <div id="modalTitle" class="center" style="margin-bottom:12px;"></div>
    <div id="modalContent"></div>
    <button onclick="closeModal()" style="width:100%;margin-top:12px;">Закрыть</button>
  </div>
</div>

<script>
const prayers=[
{key:'Fajr',name:'Фаджр'},
{key:'Dhuhr',name:'Зухр'},
{key:'Asr',name:'Аср'},
{key:'Maghrib',name:'Магриб'},
{key:'Isha',name:'Иша'}
];

let viewDate=new Date();
let activeDateKey='';

function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function renderCalendar(){
  const cal=document.getElementById('calendar');
  cal.innerHTML='';
  const y=viewDate.getFullYear();
  const m=viewDate.getMonth();
  document.getElementById('monthTitle').innerText=
    viewDate.toLocaleString('ru',{month:'long',year:'numeric'});

  const days=new Date(y,m+1,0).getDate();
  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d);
    const key=dateKey(date);
    let count=0;
    prayers.forEach(p=>{
      if(localStorage.getItem(key+'_'+p.key))count++;
    });

    let cls='cal-day';
    if(count===5)cls+=' done';
    else if(count>0)cls+=' partial';
    if(key===dateKey(new Date()))cls+=' today';

    cal.innerHTML+=`<div class="${cls}" onclick="openDay('${key}',${d})">${d}</div>`;
  }
}

function changeMonth(n){
  viewDate.setMonth(viewDate.getMonth()+n);
  renderCalendar();
}

function openDay(key,day){
  activeDateKey=key;
  document.getElementById('modal').style.display='block';
  document.getElementById('modalTitle').innerText='📅 '+day;
  renderDay();
}

function renderDay(){
  let html='';
  prayers.forEach(p=>{
    const done=localStorage.getItem(activeDateKey+'_'+p.key);
    html+=`
      <div class="modal-prayer ${done?'done':''}"
           onclick="togglePrayer('${p.key}')">
        <span>${p.name}</span>
        <span>${done?'✔':'◻'}</span>
      </div>`;
  });
  document.getElementById('modalContent').innerHTML=html;
}

function togglePrayer(prayerKey){
  const key=activeDateKey+'_'+prayerKey;
  if(localStorage.getItem(key)) localStorage.removeItem(key);
  else localStorage.setItem(key,'1');
  renderDay();
  renderCalendar();
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}

renderCalendar();
</script>

</body>
</html>
