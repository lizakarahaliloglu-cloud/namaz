<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Мой день</title>

<meta name="theme-color" content="#f4efe9">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  max-width: 420px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
  background: linear-gradient(180deg,#f6f1eb,#efe7dc);
  color: #4b3f35;
}

/* ---------- HEADER ---------- */

h1 {
  text-align: center;
  margin-bottom: 14px;
  font-weight: 600;
}

/* ---------- SECTIONS ---------- */

.section {
  background: rgba(255,255,255,0.78);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,.05);
}

/* ---------- DAY PHRASE ---------- */

#dayPhrase {
  font-size: 18px;
  font-weight: 500;
  text-align: center;
  line-height: 1.4;
}

#daySub {
  text-align: center;
  font-size: 14px;
  color: #8b7c6f;
  margin-top: 8px;
}

/* ---------- INTENTION ---------- */

.intention {
  text-align: center;
  font-size: 15px;
  line-height: 1.5;
  color: #6f6156;
}

/* ---------- DUA ---------- */

.dua-ar {
  font-size: 22px;
  line-height: 1.9;
  text-align: right;
  direction: rtl;
  margin-bottom: 12px;
  color: #3e342b;
}

.dua-ru {
  font-size: 15px;
  line-height: 1.6;
  color: #7a6a5c;
  text-align: center;
}

/* ---------- PRAYER ---------- */

.prayer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  margin-bottom: 14px;
  border-radius: 20px;
  transition: all .35s ease;
}

.prayer.active {
  background: #fff;
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(0,0,0,.08);
}

.prayer.done {
  background: #ebe4dc;
  color: #9b8f84;
  transform: scale(0.97);
}

.prayer.next {
  border: 2px solid #d6b46a;
  box-shadow: 0 0 22px rgba(214,180,106,.6);
  animation: glow 2.8s infinite;
}

@keyframes glow {
  0% { box-shadow: 0 0 10px rgba(214,180,106,.35); }
  50% { box-shadow: 0 0 26px rgba(214,180,106,.75); }
  100% { box-shadow: 0 0 10px rgba(214,180,106,.35); }
}

.prayer-name {
  font-weight: 600;
  font-size: 16px;
}

.prayer-time {
  font-size: 14px;
  color: #7a6a5c;
}

/* ---------- BUTTON ---------- */

button {
  border: none;
  padding: 10px 16px;
  border-radius: 22px;
  font-weight: 600;
  cursor: pointer;
  background: #d6b46a;
  color: #fff;
  transition: all .25s ease;
}

button.checked {
  background: #bdb1a6;
}

/* ---------- PROGRESS ---------- */

#progress {
  text-align: center;
  font-size: 14px;
  color: #7a6a5c;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🌿 Мой день</h1>

<!-- ФРАЗА ДНЯ -->
<div class="section">
  <div id="dayPhrase"></div>
  <div id="daySub">Сегодня можно идти медленно</div>
</div>

<!-- НАМЕРЕНИЕ -->
<div class="section">
  <div class="intention">
    Я совершаю намазы сегодня спокойно,<br>
    с благодарностью и мягким сердцем.
  </div>
</div>

<!-- ДУА -->
<div class="section">
  <div class="dua-ar">
    اللَّهُمَّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي
  </div>
  <div class="dua-ru">
    О Аллах, раскрой моё сердце и облегчи мои дела.
  </div>
</div>

<!-- НАМАЗ -->
<div class="section" id="times"></div>
<div id="progress"></div>

<script>
/* ---------- PHRASES ---------- */

const phrases = [
  "Ты уже в нужном месте",
  "Аллах видит даже тихие шаги",
  "Сегодня достаточно быть",
  "Спокойствие — тоже ибадат",
  "Не спеши, тебе некуда опаздывать",
  "Этот день уже благословлён"
];

function setDayPhrase() {
  const day = new Date().getDate();
  document.getElementById('dayPhrase').innerText =
    "🌾 " + phrases[day % phrases.length];
}

/* ---------- PRAYERS ---------- */

const prayers = [
  { key:'Fajr', name:'Фаджр ☀️' },
  { key:'Dhuhr', name:'Зухр 🌞' },
  { key:'Asr', name:'Аср 🌅' },
  { key:'Maghrib', name:'Магриб 🌇' },
  { key:'Isha', name:'Иша 🌙' }
];

let todayTimes = {};

function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

async function loadTimes() {
  const res = await fetch(
    'https://api.aladhan.com/v1/timingsByCity?city=Istanbul&country=Turkey&method=13'
  );
  const data = await res.json();
  todayTimes = data.data.timings;
  render();
}

function render() {
  const now = new Date();
  const today = getTodayKey();
  let nextFound = false;
  let done = 0;
  let html = '';

  prayers.forEach(p => {
    const time = todayTimes[p.key];
    const [h,m] = time.split(':');
    const t = new Date();
    t.setHours(h,m,0);

    const key = `${today}_${p.key}`;
    const checked = localStorage.getItem(key) === '1';

    let cls = 'prayer';
    if (!checked) cls += ' active';
    if (checked) cls += ' done';
    if (!checked && t > now && !nextFound) {
      cls += ' next';
      nextFound = true;
    }

    if (checked) done++;

    html += `
      <div class="${cls}">
        <div>
          <div class="prayer-name">${p.name}</div>
          <div class="prayer-time">${time}</div>
        </div>
        <button class="${checked ? 'checked' : ''}"
          onclick="toggle('${key}')">
          ${checked ? '☑️' : '◻️'}
        </button>
      </div>
    `;
  });

  document.getElementById('times').innerHTML = html;
  document.getElementById('progress').innerHTML =
    `📿 Сегодня: <b>${done} из 5</b>`;
}

function toggle(key) {
  if (localStorage.getItem(key)) {
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key,'1');
  }
  render();
}

setDayPhrase();
loadTimes();
</script>

</body>
</html>
