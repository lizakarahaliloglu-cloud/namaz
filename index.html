<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой день</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  max-width:420px;
  margin:0 auto;
  padding:20px;
  background:#f6f1eb;
  color:#4b3f35;
}

h1{text-align:center;margin-bottom:16px}

.section{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}

/* CALENDAR */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.cal-day{
  aspect-ratio:1;
  border:none;
  border-radius:10px;
  background:#eee6dc;
  font-size:14px;
}

.cal-day.done{background:#d6b46a;color:#fff}
.cal-day.partial{background:#e6d6b8}
.cal-day.today{outline:2px solid #d6b46a}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
}

#modalBox{
  background:#fff;
  position:absolute;
  bottom:0;
  width:100%;
  max-width:420px;
  left:50%;
  transform:translateX(-50%);
  border-radius:20px 20px 0 0;
  padding:20px;
}

.prayer{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.prayer.done{color:#999}

button.action{
  width:100%;
  margin-top:12px;
  padding:10px;
  border:none;
  border-radius:14px;
  background:#d6b46a;
  color:#fff;
  font-weight:600;
}
</style>
</head>

<body>

<h1>🌿 Мой день</h1>

<div class="section">
  <div class="calendar" id="calendar"></div>
</div>

<div class="section" style="text-align:center;font-size:12px;color:#8b7c6f;">
  created by Elizaveta Karahaliloğlu
</div>

<!-- MODAL -->
<div id="modal">
  <div id="modalBox">
    <h3 id="modalTitle" style="text-align:center;margin-bottom:10px;"></h3>
    <div id="modalContent"></div>
    <button class="action" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script>
const prayers = [
  {key:'Fajr',name:'Фаджр'},
  {key:'Dhuhr',name:'Зухр'},
  {key:'Asr',name:'Аср'},
  {key:'Maghrib',name:'Магриб'},
  {key:'Isha',name:'Иша'}
];

let activeDate = '';

function dateKey(d){
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

function renderCalendar(){
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const days = new Date(y, m+1, 0).getDate();

  for(let d=1; d<=days; d++){
    const date = new Date(y,m,d);
    const key = dateKey(date);

    let count = 0;
    prayers.forEach(p=>{
      if(localStorage.getItem(key+'_'+p.key)) count++;
    });

    const btn = document.createElement('button');
    btn.className = 'cal-day';
    if(count===5) btn.classList.add('done');
    else if(count>0) btn.classList.add('partial');
    if(d===now.getDate()) btn.classList.add('today');

    btn.textContent = d;
    btn.onclick = () => openDay(key,d);
    cal.appendChild(btn);
  }
}

function openDay(key, day){
  activeDate = key;
  document.getElementById('modalTitle').innerText = '📅 ' + day;
  document.getElementById('modal').style.display = 'block';
  renderDay();
}

function renderDay(){
  const box = document.getElementById('modalContent');
  box.innerHTML = '';

  prayers.forEach(p=>{
    const done = localStorage.getItem(activeDate+'_'+p.key);
    const row = document.createElement('div');
    row.className = 'prayer' + (done?' done':'');
    row.innerHTML = `<span>${p.name}</span><span>${done?'✔':'◻'}</span>`;
    row.onclick = () => togglePrayer(p.key);
    box.appendChild(row);
  });
}

function togglePrayer(pKey){
  const key = activeDate+'_'+pKey;
  if(localStorage.getItem(key)) localStorage.removeItem(key);
  else localStorage.setItem(key,'1');
  renderDay();
  renderCalendar();
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}

renderCalendar();
</script>

</body>
</html>
