<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Мой день</title>

<style>
:root{
  --bg:#f6f1eb;
  --card:#ffffff;
  --text:#4b3f35;
  --soft:#9b8f84;
  --accent:#d6b46a;
}

body.dark{
  --bg:#1e2124;
  --card:#2a2f33;
  --text:#e9e4dc;
  --soft:#a6a09a;
  --accent:#c9a857;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  max-width:420px;
  margin:0 auto;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.3s;
}

.hidden{display:none}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

h1{font-size:20px;font-weight:600}

.date{
  text-align:center;
  font-size:14px;
  color:var(--soft);
  margin-bottom:14px;
}

.toggle{
  border:none;
  background:var(--card);
  padding:8px 14px;
  border-radius:18px;
}

.section{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 10px 28px rgba(0,0,0,.06);
}

.dua-ar{
  font-size:22px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
  margin-bottom:8px;
}

.dua-ru{
  font-size:14px;
  text-align:center;
  color:var(--soft);
}

.prayer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  margin-bottom:12px;
  border-radius:18px;
  transition:.3s;
}

.prayer.future{
  background:rgba(214,180,106,.18);
}

.prayer.next{
  background:var(--card);
  transform:scale(1.06);
  box-shadow:0 0 26px rgba(214,180,106,.6);
}

.prayer.done{
  opacity:.4;
  transform:scale(.96);
}

.prayer span:last-child{
  font-size:18px;
}

.main{
  width:100%;
  border:none;
  padding:14px;
  border-radius:20px;
  background:var(--accent);
  color:#fff;
  font-weight:600;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.cal-day{
  aspect-ratio:1;
  border:none;
  border-radius:14px;
  background:rgba(0,0,0,.06);
}

.cal-day.full{background:var(--accent);color:#fff}
.cal-day.part{background:rgba(214,180,106,.5)}
.cal-day.today{outline:2px solid var(--accent)}

.footer{
  text-align:center;
  font-size:12px;
  color:var(--soft);
  margin-top:16px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🌿 Мой день</h1>
  <button class="toggle" onclick="toggleTheme()">🌙</button>
</div>

<div class="date" id="todayDate"></div>

<div id="dayScreen">
  <div class="section">
    <div class="dua-ar" id="duaAr"></div>
    <div class="dua-ru" id="duaRu"></div>
  </div>

  <div class="section" id="prayers"></div>

  <button class="main" onclick="openCalendar()">📅 Календарь</button>
</div>

<div id="calendarScreen" class="hidden">
  <div class="section">
    <div class="calendar" id="calendar"></div>
  </div>
  <button class="main" onclick="backToToday()">← Мой день</button>
</div>

<div class="footer">created by Elizaveta Karahaliloğlu</div>

<script>
/* ---------- STATE ---------- */
let selectedDate = new Date();

/* ---------- THEME ---------- */
if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark');
function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');
}

/* ---------- DATE ---------- */
function dateKey(d){
  return d.toISOString().split('T')[0];
}
todayDate.innerText = selectedDate.toLocaleDateString('ru-RU',{
  weekday:'long',day:'numeric',month:'long'
});

/* ---------- DUA ---------- */
const duas=[
  ["اللَّهُمَّ اشْرَحْ لِي صَدْرِي","О Аллах, раскрой моё сердце"],
  ["اللَّهُمَّ بَارِكْ لِي فِي هَذَا الْيَوْمِ","О Аллах, благослови этот день"],
  ["رَبِّ زِدْنِي عِلْمًا","Господь, увеличь мои знания"]
];
const dua=duas[selectedDate.getDate()%duas.length];
duaAr.innerText=dua[0];
duaRu.innerText=dua[1];

/* ---------- PRAYERS ---------- */
const prayersList=['Фаджр','Зухр','Аср','Магриб','Иша'];

function renderPrayers(){
  prayers.innerHTML='';
  const now=new Date();
  let nextShown=false;

  prayersList.forEach((p,i)=>{
    const key=dateKey(selectedDate)+'_'+i;
    const done=localStorage.getItem(key);

    let cls='prayer ';
    if(done) cls+='done';
    else if(!nextShown && selectedDate.toDateString()===now.toDateString()){
      cls+='next';
      nextShown=true;
    } else cls+='future';

    const row=document.createElement('div');
    row.className=cls;
    row.innerHTML=`<span>${p}</span><span>${done?'✔':'◻'}</span>`;
    row.onclick=()=>togglePrayer(key);
    prayers.appendChild(row);
  });
}

function togglePrayer(key){
  localStorage.getItem(key)
    ? localStorage.removeItem(key)
    : localStorage.setItem(key,'1');
  renderPrayers();
  renderCalendar();
}

/* ---------- CALENDAR ---------- */
function renderCalendar(){
  calendar.innerHTML='';
  const y=selectedDate.getFullYear();
  const m=selectedDate.getMonth();
  const days=new Date(y,m+1,0).getDate();

  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d);
    const key=dateKey(date);
    let count=0;
    prayersList.forEach((_,i)=>{
      if(localStorage.getItem(key+'_'+i)) count++;
    });

    const btn=document.createElement('button');
    btn.className='cal-day';
    if(count===5) btn.classList.add('full');
    else if(count>0) btn.classList.add('part');
    if(date.toDateString()===new Date().toDateString()) btn.classList.add('today');
    btn.innerText=d;

    btn.onclick=()=>{
      selectedDate=date;
      backToToday();
    };
    calendar.appendChild(btn);
  }
}

/* ---------- NAV ---------- */
function openCalendar(){
  dayScreen.classList.add('hidden');
  calendarScreen.classList.remove('hidden');
}
function backToToday(){
  calendarScreen.classList.add('hidden');
  dayScreen.classList.remove('hidden');
  todayDate.innerText=selectedDate.toLocaleDateString('ru-RU',{
    weekday:'long',day:'numeric',month:'long'
  });
  renderPrayers();
}

/* ---------- INIT ---------- */
renderPrayers();
renderCalendar();
</script>

</body>
</html>
