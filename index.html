<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Мой день</title>

<style>
:root{
  --bg:#f6f1eb;
  --card:#ffffff;
  --text:#4b3f35;
  --soft:#8b7c6f;
  --accent:#d6b46a;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  max-width:420px;
  margin:0 auto;
  padding:20px;
  background:linear-gradient(180deg,#f6f1eb,#efe7dc);
  color:var(--text);
  min-height:100vh;
}

h1{
  text-align:center;
  margin-bottom:14px;
  font-weight:600;
}

.section{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.05);
}

/* PHRASE */
.phrase{
  text-align:center;
  font-size:18px;
  font-weight:500;
}

.phrase-sub{
  margin-top:8px;
  font-size:14px;
  color:var(--soft);
  text-align:center;
}

/* DUA */
.dua-ar{
  font-size:22px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
  margin-bottom:10px;
}

.dua-ru{
  font-size:15px;
  text-align:center;
  color:var(--soft);
}

/* PRAYERS */
.prayer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid rgba(0,0,0,.05);
  font-size:15px;
}

.prayer.done{color:#9b8f84}

.prayer span:last-child{
  font-size:18px;
}

/* BUTTONS */
button{
  border:none;
  background:var(--accent);
  color:#fff;
  padding:12px;
  border-radius:18px;
  font-weight:600;
  font-size:15px;
  width:100%;
}

button.secondary{
  background:#e6d6b8;
  color:#4b3f35;
  margin-top:10px;
}

/* CALENDAR */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.cal-day{
  aspect-ratio:1;
  border:none;
  border-radius:14px;
  background:#f1ebe4;
  font-size:14px;
}

.cal-day.done{background:var(--accent);color:#fff}
.cal-day.partial{background:#e6d6b8}
.cal-day.today{outline:2px solid var(--accent)}

.hidden{display:none}

.footer{
  text-align:center;
  font-size:12px;
  color:var(--soft);
  margin-top:14px;
}
</style>
</head>

<body>

<h1>🌿 Мой день</h1>

<!-- МОЙ ДЕНЬ -->
<div id="dayScreen">

  <div class="section">
    <div class="phrase" id="phraseText"></div>
    <div class="phrase-sub">Сегодня можно идти мягко</div>
  </div>

  <div class="section">
    <div class="dua-ar" id="duaAr"></div>
    <div class="dua-ru" id="duaRu"></div>
  </div>

  <div class="section" id="todayPrayers"></div>

  <button onclick="openCalendar()">📅 Календарь</button>

</div>

<!-- КАЛЕНДАРЬ -->
<div id="calendarScreen" class="hidden">

  <div class="section">
    <div class="calendar" id="calendar"></div>
  </div>

  <button class="secondary" onclick="backToDay()">← Назад</button>

</div>

<div class="footer">
  created by Elizaveta Karahaliloğlu
</div>

<script>
/* PHRASES */
const phrases=[
  "Ты уже в нужном месте",
  "Аллах видит даже тихие шаги",
  "Сегодня достаточно быть",
  "Спокойствие — тоже ибадат",
  "Этот день уже благословлён"
];

/* DUA */
const duas=[
  {
    ar:"اللَّهُمَّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي",
    ru:"О Аллах, раскрой моё сердце и облегчи мои дела."
  },
  {
    ar:"اللَّهُمَّ بَارِكْ لِي فِي هَذَا الْيَوْمِ",
    ru:"О Аллах, благослови для меня этот день."
  }
];

const prayers=[
  {key:'Fajr',name:'Фаджр'},
  {key:'Dhuhr',name:'Зухр'},
  {key:'Asr',name:'Аср'},
  {key:'Maghrib',name:'Магриб'},
  {key:'Isha',name:'Иша'}
];

function dateKey(d){
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

const today=new Date();
const todayKey=dateKey(today);

/* INIT */
document.getElementById('phraseText').innerText =
  "🌾 " + phrases[today.getDate()%phrases.length];

const dua=duas[today.getDate()%duas.length];
document.getElementById('duaAr').innerText=dua.ar;
document.getElementById('duaRu').innerText=dua.ru;

/* TODAY PRAYERS */
function renderToday(){
  const box=document.getElementById('todayPrayers');
  box.innerHTML='';
  prayers.forEach(p=>{
    const done=localStorage.getItem(todayKey+'_'+p.key);
    const row=document.createElement('div');
    row.className='prayer'+(done?' done':'');
    row.innerHTML=`<span>${p.name}</span><span>${done?'✔':'◻'}</span>`;
    row.onclick=()=>toggle(todayKey,p.key);
    box.appendChild(row);
  });
}

/* TOGGLE */
function toggle(date,pKey){
  const key=date+'_'+pKey;
  if(localStorage.getItem(key)) localStorage.removeItem(key);
  else localStorage.setItem(key,'1');
  renderToday();
  renderCalendar();
}

/* SCREENS */
function openCalendar(){
  document.getElementById('dayScreen').classList.add('hidden');
  document.getElementById('calendarScreen').classList.remove('hidden');
}

function backToDay(){
  document.getElementById('calendarScreen').classList.add('hidden');
  document.getElementById('dayScreen').classList.remove('hidden');
}

/* CALENDAR */
function renderCalendar(){
  const cal=document.getElementById('calendar');
  cal.innerHTML='';
  const y=today.getFullYear();
  const m=today.getMonth();
  const days=new Date(y,m+1,0).getDate();

  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d);
    const key=dateKey(date);
    let count=0;
    prayers.forEach(p=>{
      if(localStorage.getItem(key+'_'+p.key)) count++;
    });

    const btn=document.createElement('button');
    btn.className='cal-day';
    if(count===5) btn.classList.add('done');
    else if(count>0) btn.classList.add('partial');
    if(d===today.getDate()) btn.classList.add('today');

    btn.innerText=d;
    btn.onclick=()=>{
      backToDay();
    };
    cal.appendChild(btn);
  }
}

renderToday();
renderCalendar();
</script>

</body>
</html>
