<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>🕌 Трекер Намаза</title>

<meta name="theme-color" content="#0f2027">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --glass: rgba(255,255,255,0.15);
  --glass-border: rgba(255,255,255,0.25);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:430px;
  padding:20px 16px 40px;
}

h1{
  text-align:center;
  font-size:22px;
  margin-bottom:16px;
  font-weight:600;
}

.card{
  background:var(--glass);
  backdrop-filter:blur(14px);
  border:1px solid var(--glass-border);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
}

.status{
  text-align:center;
  font-size:14px;
  opacity:.9;
  margin-bottom:8px;
}

.next{
  text-align:center;
  font-size:15px;
  line-height:1.4;
}

.progress{
  text-align:center;
  margin-top:6px;
  font-size:14px;
}

.prayer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,.12);
  margin-bottom:10px;
  transition:.3s;
}

.prayer.past{opacity:.45}

.prayer.next{
  outline:2px solid #ffd700;
  box-shadow:0 0 12px rgba(255,215,0,.6);
}

.prayer-name{font-weight:600}
.prayer-time{font-size:13px;opacity:.8}

button{
  border:none;
  border-radius:20px;
  padding:8px 14px;
  background:linear-gradient(45deg,#28a745,#20c997);
  color:#fff;
  font-weight:600;
  transition:.2s;
}

button.checked{
  background:linear-gradient(45deg,#ffc107,#ff9800);
}

button:active{transform:scale(.95)}

.refresh{
  width:100%;
  padding:14px;
  border-radius:22px;
  margin-top:8px;
  background:linear-gradient(45deg,#007bff,#0056b3);
  font-size:15px;
}
</style>
</head>

<body>
<div class="app">

<h1>🕌 Трекер Намаза</h1>

<div class="card">
  <div class="status" id="status">Загрузка…</div>
  <div class="next" id="nextPrayer"></div>
  <div class="progress" id="progress"></div>
</div>

<div class="card" id="times"></div>

<button class="refresh" onclick="loadTimes()">🔄 Обновить</button>

</div>

<script>
const prayers=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
const names={
  Fajr:"Фаджр ☀️",
  Dhuhr:"Зухр 🌞",
  Asr:"Аср 🌅",
  Maghrib:"Магриб 🌇",
  Isha:"Иша 🌙"
};

let todayTimes={};

async function loadTimes(){
  const status=document.getElementById("status");
  status.textContent="⏳ Загрузка времён намаза…";
  try{
    const res=await fetch("https://api.aladhan.com/v1/timingsByCity?city=Istanbul&country=Turkey&method=13");
    const data=await res.json();
    todayTimes=data.data.timings;
    render();
    status.textContent="📅 Сегодня";
  }catch{
    status.textContent="Ошибка загрузки";
  }
}

function render(){
  const now=new Date();
  const today=now.toISOString().split("T")[0];
  let html="";
  let next=false;
  let done=0;

  prayers.forEach(p=>{
    const [h,m]=todayTimes[p].split(":");
    const t=new Date();t.setHours(h,m,0);
    let cls="prayer";
    if(t<now)cls+=" past";
    else if(!next){cls+=" next";next=true}

    const key=today+"_"+p;
    const checked=localStorage.getItem(key);
    if(checked)done++;

    html+=`
    <div class="${cls}">
      <div>
        <div class="prayer-name">${names[p]}</div>
        <div class="prayer-time">${todayTimes[p]}</div>
      </div>
      <button class="${checked?"checked":""}" onclick="toggle('${key}',this)">
        ${checked?"✓":"Отметить"}
      </button>
    </div>`;
  });

  document.getElementById("times").innerHTML=html;
  document.getElementById("progress").innerHTML=`📿 Сегодня выполнено: <b>${done} из 5</b>`;
  nextPrayer();
}

function toggle(key,btn){
  if(localStorage.getItem(key)){
    localStorage.removeItem(key);
    btn.classList.remove("checked");
    btn.textContent="Отметить";
  }else{
    localStorage.setItem(key,"1");
    btn.classList.add("checked");
    btn.textContent="✓";
  }
  render();
}

function nextPrayer(){
  const now=new Date();
  for(let p of prayers){
    const [h,m]=todayTimes[p].split(":");
    const t=new Date();t.setHours(h,m,0);
    if(t>now){
      const diff=Math.floor((t-now)/60000);
      document.getElementById("nextPrayer").innerHTML=
      `🕋 Следующий: <b>${names[p]}</b><br>через ${Math.floor(diff/60)}ч ${diff%60}м`;
      return;
    }
  }
}

loadTimes();
</script>

</body>
</html>
