<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕌 Трекер Намаза</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2027">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 20px;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: #fff;
    min-height: 100vh;
}

h1 {
    text-align: center;
    margin-bottom: 15px;
}

#status, #nextPrayer, #progress {
    text-align: center;
    margin-bottom: 12px;
}

#times {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 16px;
}

.prayer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    transition: all .3s;
}

.prayer.past { opacity: 0.45; }

.prayer.next {
    border: 2px solid #ffd700;
    box-shadow: 0 0 15px rgba(255,215,0,.5);
}

.prayer-name { font-size: 17px; font-weight: 600; }
.prayer-time { opacity: .85; }

button {
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
    cursor: pointer;
    background: linear-gradient(45deg,#28a745,#20c997);
    color: #fff;
    font-weight: 600;
}

button.checked {
    background: linear-gradient(45deg,#ffc107,#ff9800);
    animation: pop .3s ease;
}

@keyframes pop {
    0%{transform:scale(1)}
    50%{transform:scale(1.15)}
    100%{transform:scale(1)}
}

#refresh {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    font-size: 15px;
    background: linear-gradient(45deg,#007bff,#0056b3);
}
</style>
</head>

<body>

<h1>🕌 Трекер Намаза</h1>
<div id="status">Загрузка…</div>
<div id="nextPrayer"></div>
<div id="progress"></div>

<div id="times"></div>
<button id="refresh" onclick="loadTimes()">🔄 Обновить</button>

<script>
const prayers = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const prayerNames = {
    Fajr:'Фаджр ☀️',
    Dhuhr:'Зухр 🌞',
    Asr:'Аср 🌅',
    Maghrib:'Магриб 🌇',
    Isha:'Иша 🌙'
};

let todayTimes = {};
let city = localStorage.getItem('city') || 'Istanbul';

async function loadTimes() {
    const status = document.getElementById('status');
    status.innerText = '⏳ Загрузка времён намаза…';

    try {
        const url = `https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Turkey&method=13`;
        const response = await fetch(url);

        if (!response.ok) throw new Error('API error');

        const data = await response.json();
        todayTimes = data.data.timings;

        updateDisplay();
        status.innerText = '📅 Сегодня';
    } catch (e) {
        status.innerText = '❌ Ошибка загрузки';
        console.error(e);
    }
}

function updateDisplay() {
    const times = document.getElementById('times');
    const now = new Date();
    const today = now.toISOString().split('T')[0];
    let html = '';
    let nextFound = false;

    prayers.forEach(p => {
        const timeStr = todayTimes[p];
        let cls = 'prayer';

        const [h,m] = timeStr.split(':');
        const t = new Date();
        t.setHours(h,m,0);

        if (t < now) cls += ' past';
        else if (!nextFound) {
            cls += ' next';
            nextFound = true;
        }

        const key = `${today}_${p}`;
        const checked = localStorage.getItem(key) === 'checked';

        html += `
        <div class="${cls}">
            <div>
                <div class="prayer-name">${prayerNames[p]}</div>
                <div class="prayer-time">${timeStr}</div>
            </div>
            <button class="${checked?'checked':''}"
                onclick="togglePrayer('${today}','${p}',this)">
                ${checked?'✓ Выполнен':'Отметить'}
            </button>
        </div>`;
    });

    times.innerHTML = html;
    updateNextPrayer();
    updateProgress(today);
}

function togglePrayer(date, prayer, btn) {
    const key = `${date}_${prayer}`;
    if (localStorage.getItem(key)) {
        localStorage.removeItem(key);
        btn.classList.remove('checked');
        btn.innerText = 'Отметить';
    } else {
        localStorage.setItem(key,'checked');
        btn.classList.add('checked');
        btn.innerText = '✓ Выполнен';
    }

    updateProgress(date);

    let done = 0;
    prayers.forEach(p=>{
        if(localStorage.getItem(`${date}_${p}`)==='checked') done++;
    });

    if(done===5){
        setTimeout(()=>{
            alert('🤍 Аллахумма такаббаль منا');
        },300);
    }
}

function updateNextPrayer() {
    const now = new Date();
    for (let p of prayers) {
        const [h,m] = todayTimes[p].split(':');
        const t = new Date();
        t.setHours(h,m,0);
        if (t > now) {
            const diff = Math.floor((t-now)/60000);
            document.getElementById('nextPrayer').innerHTML =
                `🕋 Следующий: <b>${prayerNames[p]}</b><br>через ${Math.floor(diff/60)}ч ${diff%60}м`;
            return;
        }
    }
}

function updateProgress(today){
    let done = 0;
    prayers.forEach(p=>{
        if(localStorage.getItem(`${today}_${p}`)==='checked') done++;
    });
    document.getElementById('progress').innerHTML =
        `📿 Сегодня выполнено: <b>${done} из 5</b>`;
}

loadTimes();
setInterval(loadTimes, 30*60*1000);

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
