<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Мой день</title>

<style>
:root{
  --bg:#f6f1eb;
  --card:#ffffff;
  --text:#4b3f35;
  --soft:#8b7c6f;
  --accent:#d6b46a;
}

body.dark{
  --bg:#1f2326;
  --card:#2a2f33;
  --text:#e6e1db;
  --soft:#a9a39c;
  --accent:#caa85a;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  max-width:420px;
  margin:0 auto;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.3s;
}

.hidden{display:none}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

h1{font-size:20px;font-weight:600}

.toggle{
  border:none;
  background:var(--card);
  color:var(--text);
  border-radius:20px;
  padding:8px 14px;
}

/* SECTIONS */
.section{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.05);
}

/* PHRASE */
.phrase{
  text-align:center;
  font-size:18px;
  font-weight:500;
}

.phrase-sub{
  margin-top:8px;
  font-size:14px;
  color:var(--soft);
  text-align:center;
}

/* DUA */
.dua-ar{
  font-size:22px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
  margin-bottom:10px;
}

.dua-ru{
  font-size:15px;
  text-align:center;
  color:var(--soft);
}

/* PRAYERS (ВОЗВРАЩЁННЫЙ СТИЛЬ) */
.prayer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  margin-bottom:14px;
  border-radius:20px;
  transition:.35s;
  background:rgba(0,0,0,.04);
}

.prayer.active{
  background:var(--card);
  transform:scale(1.05);
  box-shadow:0 6px 20px rgba(0,0,0,.1);
}

.prayer.done{
  opacity:.45;
  transform:scale(.96);
}

.prayer.next{
  border:2px solid var(--accent);
  box-shadow:0 0 22px rgba(214,180,106,.6);
}

.prayer-name{font-weight:600}
.prayer-time{font-size:14px;color:var(--soft)}

/* BUTTONS */
button.main{
  width:100%;
  border:none;
  padding:12px;
  border-radius:18px;
  background:var(--accent);
  color:#fff;
  font-weight:600;
}

/* CALENDAR */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.cal-day{
  aspect-ratio:1;
  border:none;
  border-radius:14px;
  background:rgba(0,0,0,.06);
  color:var(--text);
  font-size:14px;
}

.cal-day.done{background:var(--accent);color:#fff}
.cal-day.partial{background:rgba(214,180,106,.45)}
.cal-day.today{outline:2px solid var(--accent)}

.footer{
  text-align:center;
  font-size:12px;
  color:var(--soft);
  margin-top:14px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🌿 Мой день</h1>
  <button class="toggle" onclick="toggleTheme()">🌙</button>
</div>

<!-- МОЙ ДЕНЬ -->
<div id="dayScreen">

  <div class="section">
    <div class="phrase" id="phraseText"></div>
    <div class="phrase-sub">Сегодня можно идти мягко</div>
  </div>

  <div class="section">
    <div class="dua-ar" id="duaAr"></div>
    <div class="dua-ru" id="duaRu"></div>
  </div>

  <div class="section" id="prayersBox"></div>

  <button class="main" onclick="openCalendar()">📅 Календарь</button>
</div>

<!-- КАЛЕНДАРЬ -->
<div id="calendarScreen" class="hidden">
  <div class="section">
    <div class="calendar" id="calendar"></div>
  </div>
  <button class="main" onclick="backToDay()">← Назад</button>
</div>

<div class="footer">
  created by Elizaveta Karahaliloğlu
</div>

<script>
/* THEME */
function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.setItem('theme',
    document.body.classList.contains('dark')?'dark':'light');
}
if(localStorage.getItem('theme')==='dark'){
  document.body.classList.add('dark');
}

/* DATA */
const prayers=[
  {key:'Fajr',name:'Фаджр',time:'05:30'},
  {key:'Dhuhr',name:'Зухр',time:'13:10'},
  {key:'Asr',name:'Аср',time:'16:45'},
  {key:'Maghrib',name:'Магриб',time:'18:30'},
  {key:'Isha',name:'Иша',time:'20:00'}
];

function dateKey(d){
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

let activeDate = dateKey(new Date());

/* RENDER PRAYERS */
function renderPrayers(){
  const box = document.getElementById('prayersBox');
  box.innerHTML = '';
  const now = new Date();

  let nextFound = false;

  prayers.forEach(p=>{
    const key = activeDate+'_'+p.key;
    const done = localStorage.getItem(key);

    let cls = 'prayer';
    if(done) cls += ' done';
    else cls += ' active';

    if(!done && !nextFound){
      cls += ' next';
      nextFound = true;
    }

    const div = document.createElement('div');
    div.className = cls;
    div.innerHTML = `
      <div>
        <div class="prayer-name">${p.name}</div>
        <div class="prayer-time">${p.time}</div>
      </div>
      <div>${done?'✔':'◻'}</div>
    `;
    div.onclick = ()=>{
      if(done) localStorage.removeItem(key);
      else localStorage.setItem(key,'1');
      renderPrayers();
      renderCalendar();
    };
    box.appendChild(div);
  });
}

/* CALENDAR */
function renderCalendar(){
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  const today = new Date();
  const y = today.getFullYear();
  const m = today.getMonth();
  const days = new Date(y,m+1,0).getDate();

  for(let d=1; d<=days; d++){
    const date = new Date(y,m,d);
    const key = dateKey(date);
    let count = 0;
    prayers.forEach(p=>{
      if(localStorage.getItem(key+'_'+p.key)) count++;
    });

    const btn = document.createElement('button');
    btn.className = 'cal-day';
    if(count===5) btn.classList.add('done');
    else if(count>0) btn.classList.add('partial');
    if(d===today.getDate()) btn.classList.add('today');
    btn.innerText = d;

    btn.onclick = ()=>{
      activeDate = key;
      backToDay();
      renderPrayers();
    };

    cal.appendChild(btn);
  }
}

/* SCREENS */
function openCalendar(){
  dayScreen.classList.add('hidden');
  calendarScreen.classList.remove('hidden');
}

function backToDay(){
  calendarScreen.classList.add('hidden');
  dayScreen.classList.remove('hidden');
}

/* INIT */
renderPrayers();
renderCalendar();
</script>

</body>
</html>
