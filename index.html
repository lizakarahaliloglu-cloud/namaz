<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Мой день</title>

<style>
:root{
  --bg:#f6f1eb;
  --card:#ffffff;
  --text:#4b3f35;
  --soft:#8b7c6f;
  --accent:#d6b46a;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  max-width:420px;
  margin:0 auto;
  padding:20px;
  background:linear-gradient(180deg,#f6f1eb,#efe7dc);
  color:var(--text);
  min-height:100vh;
}

h1{
  text-align:center;
  margin-bottom:18px;
  font-weight:600;
}

.section{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.05);
}

/* DUA */
.dua-ar{
  font-size:22px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
  margin-bottom:12px;
}

.dua-ru{
  font-size:15px;
  line-height:1.6;
  text-align:center;
  color:var(--soft);
}

/* CALENDAR */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.cal-day{
  aspect-ratio:1;
  border:none;
  border-radius:14px;
  background:#f1ebe4;
  font-size:14px;
  font-weight:500;
  color:var(--text);
}

.cal-day.done{background:var(--accent);color:#fff}
.cal-day.partial{background:#e6d6b8}
.cal-day.today{outline:2px solid var(--accent)}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  z-index:10;
}

#modalBox{
  background:var(--card);
  position:absolute;
  bottom:0;
  width:100%;
  max-width:420px;
  left:50%;
  transform:translateX(-50%);
  border-radius:26px 26px 0 0;
  padding:20px;
  box-shadow:0 -10px 30px rgba(0,0,0,.15);
}

.prayer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid rgba(0,0,0,.05);
  font-size:15px;
}

.prayer.done{color:#9b8f84}

button.action{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:18px;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  font-size:15px;
}

.footer{
  text-align:center;
  font-size:12px;
  color:var(--soft);
  margin-top:10px;
}
</style>
</head>

<body>

<h1>🌿 Мой день</h1>

<!-- DUA -->
<div class="section">
  <div class="dua-ar" id="duaAr"></div>
  <div class="dua-ru" id="duaRu"></div>
</div>

<!-- CALENDAR -->
<div class="section">
  <div class="calendar" id="calendar"></div>
</div>

<div class="footer">
  created by Elizaveta Karahaliloğlu
</div>

<!-- MODAL -->
<div id="modal">
  <div id="modalBox">
    <h3 id="modalTitle" style="text-align:center;margin-bottom:12px;"></h3>
    <div id="modalContent"></div>
    <button class="action" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script>
/* ---------- DUA ---------- */
const duas = [
  {
    ar:"اللَّهُمَّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي",
    ru:"О Аллах, раскрой моё сердце и облегчи мои дела."
  },
  {
    ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ السَّكِينَةَ وَالرِّضَا",
    ru:"О Аллах, даруй мне спокойствие и довольство."
  },
  {
    ar:"رَبِّ زِدْنِي قُرْبًا مِنْكَ وَطُمَأْنِينَةً",
    ru:"Господь мой, приблизь меня к Тебе и наполни сердце покоем."
  },
  {
    ar:"اللَّهُمَّ بَارِكْ لِي فِي هَذَا الْيَوْمِ",
    ru:"О Аллах, благослови для меня этот день."
  }
];

const today = new Date().getDate();
const dua = duas[today % duas.length];
document.getElementById('duaAr').innerText = dua.ar;
document.getElementById('duaRu').innerText = dua.ru;

/* ---------- CALENDAR & PRAYERS ---------- */
const prayers = [
  {key:'Fajr',name:'Фаджр'},
  {key:'Dhuhr',name:'Зухр'},
  {key:'Asr',name:'Аср'},
  {key:'Maghrib',name:'Магриб'},
  {key:'Isha',name:'Иша'}
];

let activeDate = '';

function dateKey(d){
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

function renderCalendar(){
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const days = new Date(y, m+1, 0).getDate();

  for(let d=1; d<=days; d++){
    const date = new Date(y,m,d);
    const key = dateKey(date);

    let count = 0;
    prayers.forEach(p=>{
      if(localStorage.getItem(key+'_'+p.key)) count++;
    });

    const btn = document.createElement('button');
    btn.className = 'cal-day';
    if(count===5) btn.classList.add('done');
    else if(count>0) btn.classList.add('partial');
    if(d===now.getDate()) btn.classList.add('today');

    btn.textContent = d;
    btn.onclick = () => openDay(key,d);
    cal.appendChild(btn);
  }
}

function openDay(key, day){
  activeDate = key;
  document.getElementById('modalTitle').innerText = '📅 ' + day;
  document.getElementById('modal').style.display = 'block';
  renderDay();
}

function renderDay(){
  const box = document.getElementById('modalContent');
  box.innerHTML = '';

  prayers.forEach(p=>{
    const done = localStorage.getItem(activeDate+'_'+p.key);
    const row = document.createElement('div');
    row.className = 'prayer' + (done?' done':'');
    row.innerHTML = `<span>${p.name}</span><span>${done?'✔':'◻'}</span>`;
    row.onclick = () => togglePrayer(p.key);
    box.appendChild(row);
  });
}

function togglePrayer(pKey){
  const key = activeDate+'_'+pKey;
  if(localStorage.getItem(key)) localStorage.removeItem(key);
  else localStorage.setItem(key,'1');
  renderDay();
  renderCalendar();
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}

renderCalendar();
</script>

</body>
</html>
