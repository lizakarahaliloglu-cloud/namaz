<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕌 Трекер Намаза</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2027">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 20px;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: #fff;
    min-height: 100vh;
}

h1 { text-align:center; margin-bottom:15px; }

#status, #nextPrayer, #progress {
    text-align:center;
    margin-bottom:12px;
}

#times {
    background: rgba(255,255,255,0.08);
    padding:15px;
    border-radius:16px;
}

.prayer {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    margin-bottom:12px;
    background: rgba(255,255,255,0.06);
    border-radius:12px;
    transition:.3s;
}

.prayer.past { opacity:.45; }

.prayer.next {
    border:2px solid #ffd700;
    box-shadow:0 0 15px rgba(255,215,0,.5);
}

.prayer-name { font-size:17px; font-weight:600; }
.prayer-time { opacity:.85; }

button {
    border:none;
    padding:10px 16px;
    border-radius:20px;
    cursor:pointer;
    background:linear-gradient(45deg,#28a745,#20c997);
    color:#fff;
    font-weight:600;
}

button.checked {
    background:linear-gradient(45deg,#ffc107,#ff9800);
    animation:pop .3s ease;
}

@keyframes pop {
    0%{transform:scale(1)}
    50%{transform:scale(1.15)}
    100%{transform:scale(1)}
}

#refresh {
    width:100%;
    margin-top:15px;
    padding:14px;
    font-size:15px;
    background:linear-gradient(45deg,#007bff,#0056b3);
}

/* ===== МОДАЛЬНОЕ ОКНО ===== */

.modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.modal.hidden { display:none; }

.modal-content {
    background:linear-gradient(135deg,#1c2b36,#2c5364);
    border-radius:20px;
    padding:30px 25px;
    text-align:center;
    width:85%;
    max-width:320px;
    animation:fadeIn .4s ease;
}

.dua-icon { font-size:32px; margin-bottom:10px; }
.dua-text { font-size:22px; margin-bottom:8px; }
.dua-sub { font-size:14px; opacity:.85; margin-bottom:20px; }

@keyframes fadeIn {
    from { transform:scale(.9); opacity:0 }
    to { transform:scale(1); opacity:1 }
}
</style>
</head>

<body>

<!-- Модальное окно дуа -->
<div id="duaModal" class="modal hidden">
  <div class="modal-content">
    <div class="dua-icon">🤍</div>
    <div class="dua-text">اللَّهُمَّ تَقَبَّلْ مِنَّا</div>
    <div class="dua-sub">О Аллах, прими от нас</div>
    <button onclick="closeModal()">Аминь 🤲</button>
  </div>
</div>

<h1>🕌 Трекер Намаза</h1>
<div id="status">Загрузка…</div>
<div id="nextPrayer"></div>
<div id="progress"></div>

<div id="times"></div>
<button id="refresh" onclick="loadTimes()">🔄 Обновить</button>

<script>
const prayers=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const prayerNames={
Fajr:'Фаджр ☀️',Dhuhr:'Зухр 🌞',Asr:'Аср 🌅',Maghrib:'Магриб 🌇',Isha:'Иша 🌙'
};

let todayTimes={};
let city='Istanbul';

function showModal(){
    document.getElementById('duaModal').classList.remove('hidden');
}
function closeModal(){
    document.getElementById('duaModal').classList.add('hidden');
}

async function loadTimes(){
    const r=await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Turkey&method=13`);
    const d=await r.json();
    todayTimes=d.data.timings;
    updateDisplay();
}

function updateDisplay(){
    const now=new Date();
    const today=now.toISOString().split('T')[0];
    let html='',next=false;

    prayers.forEach(p=>{
        const [h,m]=todayTimes[p].split(':');
        const t=new Date(); t.setHours(h,m,0);
        let cls='prayer';
        if(t<now)cls+=' past';
        else if(!next){cls+=' next'; next=true;}

        const key=`${today}_${p}`;
        const checked=localStorage.getItem(key)==='checked';

        html+=`
        <div class="${cls}">
            <div>
                <div class="prayer-name">${prayerNames[p]}</div>
                <div class="prayer-time">${todayTimes[p]}</div>
            </div>
            <button class="${checked?'checked':''}"
            onclick="togglePrayer('${today}','${p}',this)">
            ${checked?'✓ Выполнен':'Отметить'}
            </button>
        </div>`;
    });

    times.innerHTML=html;
    updateProgress(today);
}

function togglePrayer(d,p,btn){
    const k=`${d}_${p}`;
    localStorage.getItem(k)?localStorage.removeItem(k):localStorage.setItem(k,'checked');
    updateDisplay();

    let done=0;
    prayers.forEach(x=>{
        if(localStorage.getItem(`${d}_${x}`)==='checked')done++;
    });
    if(done===5)setTimeout(showModal,300);
}

function updateProgress(d){
    let done=0;
    prayers.forEach(p=>{
        if(localStorage.getItem(`${d}_${p}`)==='checked')done++;
    });
    progress.innerHTML=`📿 Сегодня выполнено: <b>${done} из 5</b>`;
}

loadTimes();
</script>

</body>
</html>
