<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕌 Намаз — мой день</title>

<meta name="theme-color" content="#0f2027">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  max-width: 420px;
  margin: 0 auto;
  padding: 20px;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color: #fff;
  min-height: 100vh;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

#dayMessage {
  text-align: center;
  font-size: 15px;
  opacity: .9;
  margin-bottom: 15px;
}

.card {
  background: rgba(255,255,255,0.08);
  padding: 16px;
  border-radius: 18px;
  margin-bottom: 16px;
}

.prayer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  margin-bottom: 12px;
  background: rgba(255,255,255,0.06);
  border-radius: 14px;
  transition: all .3s ease;
}

.prayer.past {
  opacity: 0.4;
}

.prayer.next {
  border: 2px solid #ffd700;
  box-shadow: 0 0 14px rgba(255,215,0,.4);
}

.prayer-name {
  font-weight: 600;
  font-size: 16px;
}

.prayer-time {
  opacity: .85;
}

button {
  border: none;
  padding: 10px 16px;
  border-radius: 20px;
  cursor: pointer;
  background: linear-gradient(45deg,#28a745,#20c997);
  color: #fff;
  font-weight: 600;
  transition: transform .2s;
}

button:active {
  transform: scale(.95);
}

button.checked {
  background: linear-gradient(45deg,#ffc107,#ff9800);
}

#progress {
  text-align: center;
  font-size: 15px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🕌 Мой намаз</h1>
<div id="dayMessage"></div>

<div class="card" id="times"></div>

<div id="progress"></div>

<script>
const prayers = [
  { key:'Fajr', name:'Фаджр ☀️' },
  { key:'Dhuhr', name:'Зухр 🌞' },
  { key:'Asr', name:'Аср 🌅' },
  { key:'Maghrib', name:'Магриб 🌇' },
  { key:'Isha', name:'Иша 🌙' }
];

let todayTimes = {};

function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

async function loadTimes() {
  const res = await fetch(
    'https://api.aladhan.com/v1/timingsByCity?city=Istanbul&country=Turkey&method=13'
  );
  const data = await res.json();
  todayTimes = data.data.timings;
  render();
}

function render() {
  const now = new Date();
  const today = getTodayKey();
  let nextFound = false;
  let done = 0;
  let html = '';

  prayers.forEach(p => {
    const time = todayTimes[p.key];
    const [h,m] = time.split(':');
    const t = new Date();
    t.setHours(h,m,0);

    let cls = 'prayer';
    if (t < now) cls += ' past';
    else if (!nextFound) {
      cls += ' next';
      nextFound = true;
    }

    const key = `${today}_${p.key}`;
    const checked = localStorage.getItem(key) === '1';
    if (checked) done++;

    html += `
      <div class="${cls}">
        <div>
          <div class="prayer-name">${p.name}</div>
          <div class="prayer-time">${time}</div>
        </div>
        <button class="${checked?'checked':''}"
          onclick="toggle('${key}', this)">
          ${checked ? '✓' : 'Отметить'}
        </button>
      </div>
    `;
  });

  document.getElementById('times').innerHTML = html;
  document.getElementById('progress').innerHTML =
    `📿 Сегодня: <b>${done} из 5</b>`;

  document.getElementById('dayMessage').innerText =
    done === 0
      ? '🌙 Новый день. Пусть Аллах примет твои намерения'
      : '🤍 Продолжай, шаг за шагом';
}

function toggle(key, btn) {
  if (localStorage.getItem(key)) {
    localStorage.removeItem(key);
    btn.classList.remove('checked');
    btn.innerText = 'Отметить';
  } else {
    localStorage.setItem(key,'1');
    btn.classList.add('checked');
    btn.innerText = '✓';
  }
  render();
}

loadTimes();
</script>

</body>
</html>
