<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Мой день</title>

<meta name="theme-color" content="#f4efe9">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мой день">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: linear-gradient(180deg,#f6f1eb,#efe7dc);
  --card: rgba(255,255,255,0.78);
  --text: #4b3f35;
  --muted: #7a6a5c;
  --accent: #d6b46a;
}

body.dark {
  --bg: linear-gradient(180deg,#1e1e1e,#2a2a2a);
  --card: rgba(40,40,40,0.9);
  --text: #e6e6e6;
  --muted: #b0b0b0;
  --accent: #c9a85c;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  max-width: 420px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  transition: background .4s,color .4s;
}

/* ---------- HEADER ---------- */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

h1 { font-weight:600; }

.toggle {
  background:none;
  border:none;
  font-size:20px;
  cursor:pointer;
  color:var(--text);
}

/* ---------- SECTIONS ---------- */
.section {
  background: var(--card);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,.05);
}

/* ---------- DAY ---------- */
#dayPhrase { font-size:18px; text-align:center; }
#daySub { font-size:14px; text-align:center; color:var(--muted); margin-top:8px; }
.intention { text-align:center; font-size:15px; color:var(--muted); }

/* ---------- DUA ---------- */
.dua-ar {
  font-size:22px;
  text-align:right;
  direction:rtl;
  margin-bottom:10px;
}
.dua-ru {
  text-align:center;
  font-size:15px;
  color:var(--muted);
}

/* ---------- CALENDAR ---------- */
.cal-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-weight:500;
}
.cal-header button {
  background:none;
  border:none;
  font-size:18px;
  cursor:pointer;
  color:var(--text);
}

.calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.cal-day {
  aspect-ratio:1/1;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  background:#f1ebe4;
  color:#8a7c6f;
}

body.dark .cal-day {
  background:#3a3a3a;
  color:#bdbdbd;
}

.cal-day.done {
  background:var(--accent);
  color:#fff;
  font-weight:600;
}

.cal-day.partial {
  background:#e6d6b8;
  color:#6f5f4f;
}

.cal-day.today {
  outline:2px solid var(--accent);
}

/* ---------- PRAYER ---------- */
.prayer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  margin-bottom:14px;
  border-radius:20px;
  transition:.35s;
}

.prayer.active { background:#fff; transform:scale(1.05); }
body.dark .prayer.active { background:#2f2f2f; }

.prayer.done { background:#ebe4dc; opacity:.7; transform:scale(.97); }
.prayer.past { opacity:.5; }

.prayer.next {
  border:2px solid var(--accent);
  box-shadow:0 0 20px rgba(214,180,106,.6);
}

/* ---------- BUTTON ---------- */
button.mark {
  border:none;
  padding:10px 16px;
  border-radius:22px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}
button.checked { background:#bdb1a6; }

/* ---------- FOOTER ---------- */
footer {
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <h1>🌿 Мой день</h1>
  <button class="toggle" onclick="toggleTheme()">🌙</button>
</header>

<div class="section">
  <div id="dayPhrase"></div>
  <div id="daySub">Сегодня можно идти медленно</div>
</div>

<div class="section">
  <div class="intention">
    Я совершаю намазы сегодня спокойно,<br>
    с благодарностью и мягким сердцем.
  </div>
</div>

<div class="section">
  <div class="dua-ar"></div>
  <div class="dua-ru"></div>
</div>

<div class="section">
  <div class="cal-header">
    <button onclick="changeMonth(-1)">←</button>
    <div id="monthLabel"></div>
    <button onclick="changeMonth(1)">→</button>
  </div>
  <div class="calendar" id="calendar"></div>
</div>

<div class="section" id="times"></div>

<footer>
  created by Elizaveta Karahaliloğlu
</footer>

<script>
/* ---------- THEME ---------- */
function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.setItem('theme',
    document.body.classList.contains('dark')?'dark':'light');
}
if(localStorage.getItem('theme')==='dark'){
  document.body.classList.add('dark');
}

/* ---------- PHRASES & DUA ---------- */
const phrases=[
"Ты уже в нужном месте",
"Аллах видит даже тихие шаги",
"Сегодня достаточно быть",
"Спокойствие — тоже ибадат"
];
const duas=[
{ar:"اللَّهُمَّ اشْرَحْ لِي صَدْرِي",ru:"О Аллах, раскрой моё сердце."},
{ar:"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ",ru:"О Аллах, помоги мне помнить Тебя."}
];

document.getElementById('dayPhrase').innerText =
"🌾 "+phrases[new Date().getDate()%phrases.length];
const d=duas[new Date().getDate()%duas.length];
document.querySelector('.dua-ar').innerText=d.ar;
document.querySelector('.dua-ru').innerText=d.ru;

/* ---------- CALENDAR ---------- */
let current=new Date();
const prayers=['Fajr','Dhuhr','Asr','Maghrib','Isha'];

function changeMonth(dir){
  current.setMonth(current.getMonth()+dir);
  renderCalendar();
}

function renderCalendar(){
  const cal=document.getElementById('calendar');
  cal.innerHTML='';
  const y=current.getFullYear(), m=current.getMonth();
  document.getElementById('monthLabel').innerText =
    current.toLocaleString('ru',{month:'long',year:'numeric'});
  const days=new Date(y,m+1,0).getDate();
  for(let i=1;i<=days;i++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    let c=0;
    prayers.forEach(p=>localStorage.getItem(`${key}_${p}`)&&c++);
    let cls='cal-day';
    if(c===5)cls+=' done';
    else if(c>0)cls+=' partial';
    if(i===new Date().getDate()&&m===new Date().getMonth())cls+=' today';
    cal.innerHTML+=`<div class="${cls}">${i}</div>`;
  }
}
renderCalendar();
</script>

</body>
</html>
