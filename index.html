<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕌 Мой намаз</title>

<meta name="theme-color" content="#0f2027">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  max-width: 420px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
  background: linear-gradient(160deg,#0f2027,#203a43,#2c5364);
  color: #fff;
}

/* ---------- HEADER ---------- */

h1 {
  text-align: center;
  margin-bottom: 8px;
  font-weight: 600;
}

#dayMessage {
  text-align: center;
  font-size: 14px;
  opacity: .85;
  margin-bottom: 18px;
}

/* ---------- CARD ---------- */

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(14px);
  border-radius: 20px;
  padding: 16px;
}

/* ---------- PRAYER ITEM ---------- */

.prayer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 16px;
  background: rgba(255,255,255,0.07);
  transition: all .35s ease;
}

/* Прошедшие */
.prayer.past {
  opacity: .45;
}

/* Выполненные */
.prayer.done {
  background: rgba(40,167,69,.15);
  opacity: .65;
}

/* Следующий */
.prayer.next {
  border: 2px solid rgba(255,215,0,.8);
  box-shadow: 0 0 16px rgba(255,215,0,.45);
  animation: glow 2.5s infinite;
}

@keyframes glow {
  0% { box-shadow: 0 0 10px rgba(255,215,0,.3); }
  50% { box-shadow: 0 0 22px rgba(255,215,0,.6); }
  100% { box-shadow: 0 0 10px rgba(255,215,0,.3); }
}

/* ---------- TEXT ---------- */

.prayer-name {
  font-weight: 600;
  font-size: 16px;
}

.prayer-time {
  font-size: 14px;
  opacity: .85;
}

/* ---------- BUTTON ---------- */

button {
  border: none;
  padding: 9px 14px;
  border-radius: 20px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(45deg,#28a745,#20c997);
  color: #fff;
  transition: all .25s ease;
}

button:active {
  transform: scale(.95);
}

button.checked {
  background: linear-gradient(45deg,#ffc107,#ff9800);
}

/* ---------- PROGRESS ---------- */

#progress {
  text-align: center;
  margin-top: 14px;
  font-size: 15px;
  opacity: .9;
}
</style>
</head>

<body>

<h1>🕌 Мой намаз</h1>
<div id="dayMessage"></div>

<div class="card" id="times"></div>
<div id="progress"></div>

<script>
const prayers = [
  { key:'Fajr', name:'Фаджр ☀️' },
  { key:'Dhuhr', name:'Зухр 🌞' },
  { key:'Asr', name:'Аср 🌅' },
  { key:'Maghrib', name:'Магриб 🌇' },
  { key:'Isha', name:'Иша 🌙' }
];

let todayTimes = {};

function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

async function loadTimes() {
  const res = await fetch(
    'https://api.aladhan.com/v1/timingsByCity?city=Istanbul&country=Turkey&method=13'
  );
  const data = await res.json();
  todayTimes = data.data.timings;
  render();
}

function render() {
  const now = new Date();
  const today = getTodayKey();
  let nextFound = false;
  let done = 0;
  let html = '';

  prayers.forEach(p => {
    const time = todayTimes[p.key];
    const [h,m] = time.split(':');
    const t = new Date();
    t.setHours(h,m,0);

    const key = `${today}_${p.key}`;
    const checked = localStorage.getItem(key) === '1';

    let cls = 'prayer';
    if (t < now) cls += ' past';
    if (checked) cls += ' done';
    else if (t > now && !nextFound) {
      cls += ' next';
      nextFound = true;
    }

    if (checked) done++;

    html += `
      <div class="${cls}">
        <div>
          <div class="prayer-name">${p.name}</div>
          <div class="prayer-time">${time}</div>
        </div>
        <button class="${checked ? 'checked' : ''}"
          onclick="toggle('${key}')">
          ${checked ? '✓' : 'Отметить'}
        </button>
      </div>
    `;
  });

  document.getElementById('times').innerHTML = html;

  document.getElementById('progress').innerHTML =
    `📿 Сегодня: <b>${done} из 5</b>`;

  document.getElementById('dayMessage').innerText =
    done === 0
      ? '🌙 Новый день. Пусть Аллах примет твои намерения'
      : done < 5
        ? '🤍 Продолжай, шаг за шагом'
        : '✨ Пусть Аллах примет все намазы сегодня';
}

function toggle(key) {
  if (localStorage.getItem(key)) {
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key,'1');
  }
  render();
}

loadTimes();
</script>

</body>
</html>
